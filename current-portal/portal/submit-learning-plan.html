<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>提报学习计划</title>
  <link rel="stylesheet" href="../portal.css" />
</head>
<body data-shell="portal" data-active="">
<div id="chrome"></div>
<main class="main lp-wizard-main">
  <h1>提报学习计划</h1>
  <ol class="lp-wizard-steps">
    <li class="on" data-step="1"><b>① 勾选价值点</b><span>可选暂无素材的价值点</span></li>
    <li data-step="2"><b>② 选择导师</b><span>来自已选价值点的素材输出者</span></li>
    <li data-step="3"><b>③ 学习周期</b><span>季度或半年</span></li>
  </ol>
  <div class="card lp-wizard-panel" id="panel-1">
    <h2>选择本轮学习的价值点</h2>
    <p class="lp-vp-role" id="lp-vp-role"></p>
    <div class="lp-vp-list" id="lp-vp-list" role="group" aria-label="价值点列表"></div>
    <button type="button" class="btn" data-next="2">下一步</button>
  </div>
  <div class="card lp-wizard-panel" id="panel-2" hidden>
    <h2>选择辅导导师</h2>
    <p class="lp-vp-role" id="lp-mentor-lead">学习所选价值点对应的岗位素材；以下为各价值点覆盖的导师（素材输出者），可多选。</p>
    <div class="lp-vp-list lp-mentor-list" id="lp-mentor-list" role="group" aria-label="导师列表"></div>
    <p class="lead lp-mentor-empty" id="lp-mentor-empty" hidden>当前所选价值点暂无关联导师与素材，请返回调整价值点，或联系岗位管理员补充覆盖关系。</p>
    <div class="row"><button type="button" class="chip" data-next="1">上一步</button><button type="button" class="btn" id="lp-mentor-next" data-next="3">下一步</button></div>
  </div>
  <div class="card lp-wizard-panel" id="panel-3" hidden>
    <h2>周期</h2>
    <label>时长<select><option>一个季度（3 个自然月）</option><option selected>半年（6 个自然月）</option></select></label>
    <p class="lead">预计结束：2026-04-29（自提报日起算，Demo）</p>
    <div class="row"><button type="button" class="chip" data-next="2">上一步</button><button type="button" class="btn" id="lp-submit">提交本轮计划</button></div>
  </div>
  <p class="lead"><a href="me.html#learning-plan">返回个人中心 · 学习计划</a></p>
</main>
<script src="../../vpslp-professional-growth/demo/demo-state.js"></script>
<script>
  (function renderValuePoints() {
    var listEl = document.getElementById("lp-vp-list");
    var roleEl = document.getElementById("lp-vp-role");
    if (!listEl || !window.VpslpDemo) return;
    var D = VpslpDemo;
    if (roleEl) roleEl.textContent = "岗位：" + (D.ROLE || "软件产品经理");
    var hasMaterial = {};
    (D.MATERIALS || []).forEach(function (m) {
      if (m.pointId) hasMaterial[m.pointId] = true;
    });
    var defaultChecked = { vp01: true, vp09: true, vp04: true };
    var bands = ["高", "中", "低"];
    var byBand = { 高: [], 中: [], 低: [] };
    (D.POINTS || []).forEach(function (p) {
      var band = p.openness && byBand[p.openness] ? p.openness : "中";
      byBand[band].push(p);
    });

    function appendPoint(p) {
      var id = "lp-vp-" + p.id;
      var label = document.createElement("label");
      label.className = "lp-check";
      label.setAttribute("for", id);
      var input = document.createElement("input");
      input.type = "checkbox";
      input.id = id;
      input.name = "vp";
      input.value = p.id;
      input.checked = !!defaultChecked[p.id];
      var name = document.createElement("span");
      name.className = "lp-vp-name";
      name.textContent = p.name;
      label.appendChild(input);
      label.appendChild(name);
      if (!hasMaterial[p.id]) {
        var hint = document.createElement("span");
        hint.className = "lp-vp-hint";
        hint.textContent = "暂无素材 · 仍可选";
        label.appendChild(hint);
      }
      listEl.appendChild(label);
    }

    bands.forEach(function (band) {
      var items = byBand[band];
      if (!items.length) return;
      var head = document.createElement("div");
      head.className = "lp-vp-band";
      head.textContent = "开放" + band;
      listEl.appendChild(head);
      items.forEach(appendPoint);
    });
  })();

  var mentorPickCache = {};
  var lastVpKeyForMentors = "";

  function getSelectedVpIds() {
    return Array.prototype.slice
      .call(document.querySelectorAll('#lp-vp-list input[name="vp"]:checked'))
      .map(function (input) { return input.value; });
  }

  function getSelectedMentorIds() {
    return Array.prototype.slice
      .call(document.querySelectorAll('#lp-mentor-list input[name="mentor"]:checked'))
      .map(function (input) { return input.value; });
  }

  /** 已选价值点 → 素材输出导师（MATERIALS ∪ COVER） */
  function buildMentorRows(vpIds) {
    var D = VpslpDemo;
    if (!D || !vpIds.length) return [];
    var rows = {};
    function row(mid) {
      if (!rows[mid]) {
        var meta = (D.MENTORS || []).filter(function (m) { return m.id === mid; })[0];
        if (meta && meta.active === false) return null;
        rows[mid] = {
          id: mid,
          name: meta ? meta.name : mid,
          pointIds: {},
          materialCount: 0,
        };
      }
      return rows[mid];
    }
    vpIds.forEach(function (pid) {
      (D.MATERIALS || []).forEach(function (mat) {
        if (mat.pointId !== pid) return;
        var r = row(mat.mentorId);
        if (!r) return;
        r.pointIds[pid] = true;
        r.materialCount += 1;
      });
      var cover = (D.COVER && D.COVER[pid]) || [];
      cover.forEach(function (mid) {
        var r = row(mid);
        if (r) r.pointIds[pid] = true;
      });
    });
    return Object.keys(rows)
      .map(function (k) { return rows[k]; })
      .sort(function (a, b) {
        if (b.materialCount !== a.materialCount) return b.materialCount - a.materialCount;
        return a.name.localeCompare(b.name, "zh-CN");
      });
  }

  function renderMentorStep() {
    var listEl = document.getElementById("lp-mentor-list");
    var emptyEl = document.getElementById("lp-mentor-empty");
    var nextBtn = document.getElementById("lp-mentor-next");
    if (!listEl) return false;
    var vpIds = getSelectedVpIds();
    var names = vpIds.map(function (id) { return VpslpDemo.pointName(id); });
    var lead = document.getElementById("lp-mentor-lead");
    if (lead) {
      lead.textContent =
        vpIds.length
          ? "已选 " + vpIds.length + " 个价值点（" + names.join("、") + "）。以下为对应素材覆盖的导师，可多选："
          : "请先在上一页勾选至少一个价值点。";
    }
    listEl.innerHTML = "";
    var rows = buildMentorRows(vpIds);
    if (!rows.length) {
      if (emptyEl) emptyEl.hidden = !vpIds.length;
      if (nextBtn) nextBtn.disabled = !vpIds.length;
      return vpIds.length > 0;
    }
    if (emptyEl) emptyEl.hidden = true;
    if (nextBtn) nextBtn.disabled = false;
    var prevChecked = mentorPickCache;
    var defaultAll = Object.keys(prevChecked).length === 0;
    rows.forEach(function (r) {
      var id = "lp-mentor-" + r.id;
      var label = document.createElement("label");
      label.className = "lp-check lp-mentor-row";
      label.setAttribute("for", id);
      var input = document.createElement("input");
      input.type = "checkbox";
      input.name = "mentor";
      input.id = id;
      input.value = r.id;
      var shouldCheck = defaultAll ? true : !!prevChecked[r.id];
      input.checked = shouldCheck;
      input.addEventListener("change", function () {
        mentorPickCache[r.id] = input.checked;
      });
      var name = document.createElement("span");
      name.className = "lp-vp-name";
      name.textContent = r.name;
      var meta = document.createElement("span");
      meta.className = "lp-mentor-meta";
      var pts = Object.keys(r.pointIds).map(function (pid) { return VpslpDemo.pointName(pid); });
      var matHint = r.materialCount ? " · 素材 " + r.materialCount + " 篇" : " · 暂无素材条目";
      meta.textContent = "覆盖：" + pts.join("、") + matHint;
      label.appendChild(input);
      label.appendChild(name);
      label.appendChild(meta);
      listEl.appendChild(label);
      mentorPickCache[r.id] = shouldCheck;
    });
    return true;
  }

  function showStep(n) {
    document.querySelectorAll(".lp-wizard-panel").forEach(function (p) { p.hidden = true; });
    document.getElementById("panel-" + n).hidden = false;
    document.querySelectorAll(".lp-wizard-steps li").forEach(function (li) {
      li.classList.toggle("on", li.getAttribute("data-step") === String(n));
    });
    if (n === 2) renderMentorStep();
  }

  document.body.addEventListener("click", function (e) {
    var next = e.target.getAttribute("data-next");
    if (next) {
      var target = Number(next);
      if (target === 2) {
        var vpIds = getSelectedVpIds();
        if (!vpIds.length) {
          window.alert("请至少勾选一个价值点。");
          return;
        }
        var vpKey = vpIds.slice().sort().join(",");
        if (vpKey !== lastVpKeyForMentors) {
          mentorPickCache = {};
          lastVpKeyForMentors = vpKey;
        }
        showStep(2);
        return;
      }
      if (target === 3) {
        var panel2 = document.getElementById("panel-2");
        if (panel2 && !panel2.hidden) {
          var rows = buildMentorRows(getSelectedVpIds());
          if (rows.length && !getSelectedMentorIds().length) {
            window.alert("请至少选择一位导师，或返回调整价值点。");
            return;
          }
        }
        showStep(3);
        return;
      }
      showStep(target);
      return;
    }
    if (e.target.id === "lp-submit") {
      location.href = "me.html#learning-plan";
    }
  });
</script>
<script src="../chrome.js"></script>
</body>
</html>
