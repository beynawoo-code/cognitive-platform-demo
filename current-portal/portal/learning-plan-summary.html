<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>轮次学习总结</title>
  <link rel="stylesheet" href="../portal.css" />
</head>
<body data-shell="portal" data-active="me">
<div id="chrome"></div>
<main class="main lp-summary-page">
  <p class="lead"><a href="me.html#learning-plan">← 返回学习计划</a></p>
  <h1 id="lp-summary-title">轮次学习总结</h1>
  <p class="lp-vp-role" id="lp-summary-meta"></p>

  <div class="card lp-summary-view" id="lp-summary-view" hidden>
    <h2>我的总结</h2>
    <p class="lp-summary-time" id="lp-summary-time"></p>
    <div class="lp-summary-body" id="lp-summary-body"></div>
  </div>

  <div class="card lp-summary-form" id="lp-summary-form" hidden>
    <h2 id="lp-summary-form-title">提交轮次总结</h2>
    <label class="lp-summary-label" for="lp-summary-text">学习收获与下一轮计划</label>
    <textarea id="lp-summary-text" rows="8" placeholder="本轮价值点学习收获、实践应用与待改进点…"></textarea>
    <button type="button" class="btn" id="lp-summary-save">提交</button>
  </div>

  <div class="card lp-summary-feedback" id="lp-summary-feedback" hidden>
    <h2 id="feedback">导师反馈</h2>
    <ul class="lp-feedback-list" id="lp-feedback-list"></ul>
    <p class="lead lp-summary-pending" id="lp-feedback-empty" hidden>暂无导师反馈，提交总结后将由本轮导师点评。</p>
  </div>
</main>
<script src="learning-plan-rounds-mock.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var roundId = params.get("round");
    var mode = params.get("mode") || "view";
    var Mock = window.LearningPlanRoundsMock;
    if (!Mock || !roundId) return;
    var round = Mock.roundById(roundId);
    if (!round) return;

    document.getElementById("lp-summary-title").textContent = (round.title || "轮次") + " · 学习总结";
    document.getElementById("lp-summary-meta").textContent =
      "周期 " + (round.range || "") + " · 价值点 " + (round.vps || []).join("、");

    var summary = round.summary;
    var submitted = !!round.summarySubmitted && summary && summary.body;
    var viewEl = document.getElementById("lp-summary-view");
    var formEl = document.getElementById("lp-summary-form");
    var fbEl = document.getElementById("lp-summary-feedback");
    var fbList = document.getElementById("lp-feedback-list");
    var fbEmpty = document.getElementById("lp-feedback-empty");

    function showFeedback() {
      fbEl.hidden = false;
      var items = (summary && summary.feedback) || [];
      if (!items.length) {
        fbEmpty.hidden = false;
        fbList.innerHTML = "";
        return;
      }
      fbEmpty.hidden = true;
      fbList.innerHTML = items
        .map(function (f) {
          return (
            "<li><div class=\"lp-feedback-head\"><b>" +
            f.mentor +
            "</b><time>" +
            (f.at || "") +
            "</time></div><p>" +
            f.text +
            "</p></li>"
          );
        })
        .join("");
    }

    if (mode === "submit" || mode === "edit") {
      formEl.hidden = false;
      document.getElementById("lp-summary-form-title").textContent =
        mode === "edit" ? "编辑轮次总结" : "提交轮次总结";
      var ta = document.getElementById("lp-summary-text");
      if (submitted && ta) ta.value = summary.body;
      document.getElementById("lp-summary-save").addEventListener("click", function () {
        location.href = "me.html#learning-plan";
      });
      if (submitted) showFeedback();
    } else {
      if (submitted) {
        viewEl.hidden = false;
        document.getElementById("lp-summary-time").textContent =
          "提交于 " + (summary.submittedAt || "—");
        document.getElementById("lp-summary-body").textContent = summary.body;
        showFeedback();
      } else {
        formEl.hidden = false;
      }
    }

    if (location.hash === "#feedback" && submitted) {
      var target = document.getElementById("feedback");
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  })();
</script>
<script src="../chrome.js"></script>
</body>
</html>
