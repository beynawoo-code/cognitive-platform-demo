<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI试题生成</title>
  <link rel="stylesheet" href="../portal.css" />
  <link rel="stylesheet" href="../admin.css" />
</head>
<body data-shell="admin" data-active="ai">
<div id="chrome"></div>
<main class="main">
<p class="route">现网路由 <b>/exam/aiQuestion</b> · 静态可视化 · 假数据</p>
<h1>AI试题生成</h1>
<p class="lead">素材来自专业侧提交。AI 按价值点生成单选题库，后补素材单独成批，旧题保留。</p>
<ul class="aiq-rules">
  <li>考试一次只考一个价值点。题目都是单选，每题 4 个选项。</li>
  <li>开考时从该价值点题库随机抽 5 道。同岗位不同人可以抽到不同的题。</li>
  <li>生成后为待确认。确认入库后进入试题管理，未确认的题不进入。</li>
</ul>
<p class="lead" id="aiq-note" hidden></p>
<div id="aiq-list"></div>
</main>
<script src="../chrome.js"></script>
<script src="ai-question-bank.js"></script>
<script>
(function () {
  var list = document.getElementById("aiq-list");
  var note = document.getElementById("aiq-note");
  if (!list || !window.AiQuestionBank) return;

  function groups() {
    var order = [];
    var map = {};
    AiQuestionBank.batches.forEach(function (batch) {
      if (!map[batch.valuePoint]) {
        map[batch.valuePoint] = [];
        order.push(batch.valuePoint);
      }
      map[batch.valuePoint].push(batch);
    });
    return order.map(function (name) {
      return { name: name, batches: map[name] };
    });
  }

  function optionLabel(index) {
    return String.fromCharCode(65 + index);
  }

  function render() {
    list.textContent = "";
    groups().forEach(function (group) {
      var total = group.batches.reduce(function (sum, batch) {
        return sum + batch.questions.length;
      }, 0);
      var card = document.createElement("section");
      card.className = "card aiq-point";
      var title = document.createElement("h2");
      title.textContent = group.name;
      var count = document.createElement("span");
      count.className = "tag";
      count.textContent = "题库 " + total + " 题";
      title.appendChild(document.createTextNode(" "));
      title.appendChild(count);
      card.appendChild(title);

      group.batches.forEach(function (batch) {
        var confirmed = AiQuestionBank.isConfirmed(batch.id);
        var block = document.createElement("article");
        block.className = "aiq-batch";
        var head = document.createElement("div");
        head.className = "aiq-head";
        var name = document.createElement("b");
        name.textContent = batch.batchLabel + " · " + batch.questions.length + " 题";
        var meta = document.createElement("span");
        meta.textContent = "素材：" + batch.material + " · 专业提报 · " + batch.author;
        var status = document.createElement("span");
        status.className = "tag";
        status.textContent = confirmed ? "已确认" : "待确认";
        head.appendChild(name);
        head.appendChild(meta);
        head.appendChild(status);
        if (confirmed) {
          var link = document.createElement("a");
          link.href = "question-manage.html";
          link.textContent = "已进入试题管理";
          head.appendChild(link);
        } else {
          var button = document.createElement("button");
          button.type = "button";
          button.className = "btn btn-sm";
          button.textContent = "确认入库";
          button.addEventListener("click", function () {
            try {
              AiQuestionBank.confirm(batch.id);
              if (note) note.hidden = true;
              render();
            } catch (err) {
              if (note) {
                note.hidden = false;
                note.textContent = "确认没有保存。请用本地预览打开此页后再试。";
              }
            }
          });
          head.appendChild(button);
        }
        block.appendChild(head);

        var details = document.createElement("details");
        var summary = document.createElement("summary");
        summary.textContent = "查看题目";
        details.appendChild(summary);
        var items = document.createElement("ol");
        items.className = "aiq-q";
        batch.questions.forEach(function (question) {
          var item = document.createElement("li");
          var stem = document.createElement("p");
          stem.textContent = question.stem;
          item.appendChild(stem);
          var options = document.createElement("ol");
          options.className = "aiq-options";
          question.options.forEach(function (text, index) {
            var option = document.createElement("li");
            option.textContent = optionLabel(index) + ". " + text + (index === question.answer ? "（正确）" : "");
            if (index === question.answer) option.className = "is-answer";
            options.appendChild(option);
          });
          item.appendChild(options);
          items.appendChild(item);
        });
        details.appendChild(items);
        block.appendChild(details);
        card.appendChild(block);
      });
      list.appendChild(card);
    });
  }

  render();
})();
</script>
</body>
</html>
